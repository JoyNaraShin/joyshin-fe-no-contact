name: Deploy contact-free portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract portfolio source
        run: unzip -q joyshin-fe-no-contact.zip -d bundle
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bundle/joyshin-fe-no-contact/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: bundle/joyshin-fe-no-contact
        run: pnpm install --frozen-lockfile
      - name: Check and build
        working-directory: bundle/joyshin-fe-no-contact
        run: |
          pnpm check
          pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bundle/joyshin-fe-no-contact/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
